<section [class]="variant() === 'card' ? 'rounded-3xl border border-line bg-card p-5' : ''">
  <header class="mb-4 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
    <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1">
      <h2 class="text-lg font-semibold text-ink">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="text-sm text-ink-muted">{{ subtitle() }}</p>
      }
    </div>
    @if (stale()) {
      <span class="rounded-full bg-amber px-3 py-0.5 text-xs font-medium text-navy">
        Dados desatualizados
      </span>
    }
  </header>
  @if (!hasData()) {
    <p class="text-sm text-ink-muted">Aguardando dados…</p>
  }
  <ng-content />
</section>
